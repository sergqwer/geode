[package]
name = "geode-agent"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Geode's agent: DeepSeek Harness (MIT) rewritten in Rust, run natively by the app, the Linux only for commands"
publish = false

[[bin]]
name = "geode-agent"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[features]
default = ["mcp-http"]
# MCP servers over streamable HTTP (TLS through rustls); stdio servers need nothing
mcp-http = ["dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# key order matters: the model's requests are compared byte for byte with the harness's
serde_json = { version = "1", features = ["preserve_order"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
ignore = "0.4"
globset = "0.4"
htmd = "0.5"
base64 = "0.22"
imagesize = "0.13"
sha2 = "0.10"
getrandom = "0.3"
ureq = { version = "3", optional = true, default-features = false, features = ["rustls", "json"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
