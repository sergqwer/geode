<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Geode</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23241b3a'/%3E%3Cpath d='M32 12 L46 32 L32 52 L18 32 Z' fill='%23b9a8ff'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f7f6fb; --panel: #efedf6; --card: #ffffff; --line: #dcd8ea; --text: #1c1a24; --muted: #6a6680;
  --accent: #6d5bd0; --accent-text: #ffffff; --user: #e6e0ff; --err: #b3261e; --code: #f1eff8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121118; --panel: #1a1823; --card: #201e2b; --line: #2e2b3c; --text: #e9e6f4; --muted: #9a95b0;
    --accent: #b9a8ff; --accent-text: #1b1430; --user: #352c5e; --err: #ffb4ab; --code: #17151f;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.app { display: grid; grid-template-columns: 280px 1fr; height: 100dvh; }
aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 16px 16px 8px; font-weight: 600; font-size: 17px; }
.brand svg { width: 28px; height: 28px; }
.new { margin: 8px 12px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); text-align: left; }
.new:hover { border-color: var(--accent); }
.list { overflow-y: auto; flex: 1; padding: 4px 8px 12px; }
.item { display: flex; align-items: center; gap: 6px; border-radius: 10px; padding: 8px 10px; cursor: pointer; }
.item:hover { background: var(--card); }
.item.on { background: var(--user); }
.item .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .d { font-size: 12px; color: var(--muted); }
.item .x { visibility: hidden; border: 0; background: none; color: var(--muted); padding: 2px 6px; border-radius: 6px; }
.item:hover .x { visibility: visible; }
.item .x:hover { color: var(--err); }
.foot { padding: 10px 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.foot button { border: 0; background: none; color: var(--muted); padding: 0; }
.foot button:hover { color: var(--text); }
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); min-height: 52px; }
header .menu { display: none; border: 0; background: none; font-size: 22px; padding: 0 6px 0 0; }
header .title { font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .model { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
.msgs { flex: 1; overflow-y: auto; padding: 20px 16px 8px; }
.inner { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.empty { color: var(--muted); text-align: center; margin-top: 18vh; }
.m { max-width: 100%; overflow-wrap: anywhere; }
.m.user { align-self: flex-end; max-width: 85%; background: var(--user); padding: 10px 14px; border-radius: 18px 18px 4px 18px; white-space: pre-wrap; }
.m.bot { align-self: stretch; }
.m.bot .body > :first-child { margin-top: 0; }
.m.bot .body > :last-child { margin-bottom: 0; }
.m .imgs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.m .imgs img { max-width: 220px; max-height: 220px; border-radius: 10px; display: block; }
.m .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
.m .err { color: var(--err); }
.m.summary { background: var(--card); border: 1px dashed var(--line); border-radius: 14px; padding: 10px 14px; }
.m.summary .lbl, .m .lbl { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
details.think { border-left: 3px solid var(--line); padding: 2px 0 2px 12px; margin-bottom: 8px; color: var(--muted); }
details.think summary { cursor: pointer; font-size: 13px; }
details.think div { white-space: pre-wrap; font-size: 13.5px; margin-top: 4px; }
.status { color: var(--muted); font-size: 13px; }
.tool { font-size: 13px; color: var(--muted); margin: 3px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool .tname { font-weight: 600; color: var(--text); }
.tool.fail .tname, .tool.fail .mark { color: var(--err); }
.tool code { font-size: 12.5px; }
.words { color: var(--muted); margin: 4px 0 6px; }
.words > :first-child { margin-top: 0; }
.words > :last-child { margin-bottom: 0; }
.dots::after { content: "…"; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .2; } }
pre { background: var(--code); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; overflow-x: auto; font-size: 13.5px; }
code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
:not(pre) > code { background: var(--code); padding: 1px 5px; border-radius: 5px; font-size: .92em; }
table { border-collapse: collapse; margin: 8px 0; display: block; overflow-x: auto; }
th, td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
a { color: var(--accent); }
h3, h4, h5, h6 { margin: 14px 0 6px; }
p { margin: 8px 0; }
ul, ol { margin: 6px 0; padding-left: 24px; }
.composer { padding: 8px 16px calc(12px + env(safe-area-inset-bottom)); }
.box { max-width: 820px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 6px; }
.box:focus-within { border-color: var(--accent); }
.att { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px 6px 0; }
.att span { position: relative; }
.att img { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; display: block; }
.att .chip { display: flex; align-items: center; gap: 6px; height: 56px; padding: 0 12px; border-radius: 10px; background: var(--panel); font-size: 13px; }
.att .vid { position: relative; }
.badge { position: absolute; left: 4px; bottom: 4px; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; padding: 1px 5px; border-radius: 6px; }
.m .clips { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
.m .clips audio, .m .vids audio { max-width: 260px; height: 36px; }
.m .vids { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px; margin-bottom: 6px; }
.m .vids .v { position: relative; }
.m .vids img { max-width: 220px; max-height: 220px; border-radius: 10px; display: block; }
.att button { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: var(--text); color: var(--bg); font-size: 12px; line-height: 20px; padding: 0; }
.row { display: flex; align-items: flex-end; gap: 6px; }
textarea { flex: 1; resize: none; border: 0; outline: 0; background: none; padding: 9px 8px; max-height: 40vh; min-height: 40px; }
.icon { width: 40px; height: 40px; border-radius: 50%; border: 0; background: none; color: var(--muted); font-size: 20px; flex: none; }
.icon:hover { color: var(--text); }
.go { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-text); font-size: 18px; flex: none; }
.go:disabled { opacity: .4; cursor: default; }
.login { position: fixed; inset: 0; background: var(--bg); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.login.on { display: flex; }
.login form { width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
.login h1 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 10px; }
.login input { padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
.login .hint { font-size: 13px; color: var(--muted); margin: 0; }
.login .bad { color: var(--err); font-size: 14px; min-height: 1em; margin: 0; }
.login button { padding: 11px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-text); font-weight: 600; }
.qr { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.qr #qrimg { width: 200px; height: 200px; border-radius: 12px; overflow: hidden; background: #fff; }
.qr #qrimg svg { display: block; width: 200px; height: 200px; }
.qr .hint { text-align: center; }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.shade { display: none; }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  aside { position: fixed; inset: 0 auto 0 0; width: 84%; max-width: 320px; z-index: 5; transform: translateX(-100%); transition: transform .2s; }
  aside.open { transform: none; }
  .shade.open { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 4; }
  header .menu { display: block; }
  header .model { display: none; }
  .m.user { max-width: 92%; }
}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="#241b3a"/><path d="M32 12 L46 32 L32 52 L18 32 Z" fill="#b9a8ff"/></svg>Geode</div>
    <button class="new" id="new"></button>
    <div class="list" id="list"></div>
    <div class="foot"><span id="model"></span><button id="out"></button></div>
  </aside>
  <div class="shade" id="shade"></div>
  <main>
    <header><button class="menu" id="menu" aria-label="Menu">&#9776;</button><div class="title" id="title"></div><div class="model" id="hmodel"></div></header>
    <div class="msgs" id="msgs"><div class="inner" id="inner"></div></div>
    <div class="composer">
      <div class="box">
        <div class="att" id="att"></div>
        <div class="row">
          <button class="icon" id="pick" title="" hidden>&#128206;</button>
          <input type="file" id="file" accept="image/*" multiple hidden>
          <textarea id="text" rows="1"></textarea>
          <button class="go" id="go" aria-label="Send">&#10148;</button>
        </div>
      </div>
    </div>
  </main>
</div>
<div class="login" id="login">
  <form id="lf">
    <h1><svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="#241b3a"/><path d="M32 12 L46 32 L32 52 L18 32 Z" fill="#b9a8ff"/></svg>Geode</h1>
    <div class="qr"><div id="qrimg"></div><p class="hint" id="qrhint"></p></div>
    <div class="or" id="or"></div>
    <p class="hint" id="lhint"></p>
    <input type="password" id="pw" autocomplete="current-password">
    <p class="bad" id="lbad"></p>
    <button type="submit" id="lgo"></button>
  </form>
</div>
<script>
'use strict';
// the app's language (its Settings choice, else the phone's), English where a string is missing: the phone puts its
// own translations in place of GEODE_STRINGS as it sends the page (WebChat.page)
const EN = {
  newChat: 'New chat', untitled: 'New chat', message: 'A task for the agent', send: 'Send', stop: 'Stop', signIn: 'Sign in',
  password: 'Password', wrong: 'Wrong password.', tooMany: 'Too many wrong passwords: wait a minute.',
  hint: 'The password is on the Local server screen of Geode on your phone.', thinking: 'Thinking',
  summary: 'Context compressed', del: 'Delete', delAsk: 'Delete this chat?',
  empty: 'Ask anything. The model runs entirely on this phone.', noModel: 'No model selected', signOut: 'Sign out',
  attach: 'Attach an image', waiting: 'Waiting for the model', reading: 'Reading %1$d tokens…', tps: '%1$.1f tokens/s',
  qr: 'Scan it with Geode on your phone: Local server → Scan a browser\'s QR code', or: 'or type the password',
  installing: 'Starting the agent…', files: 'Agent\'s files', attachAny: 'Attach',
  audioBad: 'This sound file could not be read', videoBad: 'This video could not be read', preparing: 'Preparing the video…'
};
const L = Object.assign({}, EN, /*GEODE_STRINGS*/{});
document.documentElement.lang = /*GEODE_LANG*/'en';
document.documentElement.dir = /*GEODE_DIR*/'ltr';
/** A translation with its one value in place of its %1$d, %1$s or %1$.1f. */
function fmt(t, v) { return t.replace(/%1\$\.1f/, Number(v).toFixed(1)).replace(/%1\$[ds]/, String(v)); }
const $ = id => document.getElementById(id);
const S = { me: null, chats: [], chat: null, busy: false, images: [], clips: [], films: [], preparing: 0 };

// ---- text ----
const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function inl(s) {
  return s.split(/(`[^`\n]+`)/).map(p => (p.length > 1 && p[0] === '`' && p[p.length - 1] === '`')
    ? '<code>' + esc(p.slice(1, -1)) + '</code>'
    : esc(p).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
        .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,!?:;]|$)/g, '$1<i>$2</i>')
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, t, u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`)
  ).join('');
}
const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
function md(src) {
  const out = [], lines = src.replace(/\r/g, '').split('\n');
  let para = [], list = null, i = 0;
  const endPara = () => { if (para.length) { out.push('<p>' + para.map(inl).join('<br>') + '</p>'); para = []; } };
  const endList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  while (i < lines.length) {
    const l = lines[i];
    if (/^\s*```/.test(l)) {
      endPara(); endList();
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>');
      continue;
    }
    if (/^\s*\|/.test(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
      endPara(); endList();
      const head = cells(l); i += 2;
      let t = '<table><tr>' + head.map(c => '<th>' + inl(c) + '</th>').join('') + '</tr>';
      while (i < lines.length && /^\s*\|/.test(lines[i])) t += '<tr>' + cells(lines[i++]).map(c => '<td>' + inl(c) + '</td>').join('') + '</tr>';
      out.push(t + '</table>');
      continue;
    }
    const h = l.match(/^(#{1,4})\s+(.*)/);
    if (h) { endPara(); endList(); const n = h[1].length + 2; out.push(`<h${n}>${inl(h[2])}</h${n}>`); i++; continue; }
    const ul = l.match(/^\s*[-*+]\s+(.*)/), ol = l.match(/^\s*\d+[.)]\s+(.*)/);
    if (ul || ol) {
      endPara();
      const t = ul ? 'ul' : 'ol';
      if (list !== t) { endList(); out.push(`<${t}>`); list = t; }
      out.push('<li>' + inl((ul || ol)[1]) + '</li>'); i++; continue;
    }
    if (!l.trim()) { endPara(); endList(); i++; continue; }
    endList(); para.push(l); i++;
  }
  endPara(); endList();
  return out.join('');
}

// ---- server ----
async function api(path, opts = {}) {
  const r = await fetch(path, Object.assign({ credentials: 'same-origin' }, opts,
    { headers: Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {}) }));
  if (r.status === 401) { showLogin(); throw new Error('login'); }
  return r;
}
async function errorOf(r) { try { return (await r.json()).error || r.status; } catch (e) { return r.status; } }

function showLogin() {
  if ($('login').classList.contains('on')) return;
  $('login').classList.add('on');
  qrLoop();
}
const signedIn = () => { qrRun++; $('pw').value = ''; $('login').classList.remove('on'); boot(); };
// the QR sign-in: a code from the phone's server, then waiting (25 s a call) for the phone's yes; a new code when
// one runs out
let qrRun = 0;
async function qrLoop() {
  const my = ++qrRun;
  const live = () => my === qrRun && $('login').classList.contains('on');
  while (live()) {
    let p;
    try {
      const r = await fetch('/web/qr', { method: 'POST', credentials: 'same-origin' });
      if (!r.ok) { $('qrimg').parentElement.hidden = true; return; }
      p = await r.json();
    } catch (e) { return; }
    $('qrimg').parentElement.hidden = false;
    $('qrimg').innerHTML = p.svg;
    while (live()) {
      let st;
      try { st = await (await fetch('/web/qr/' + encodeURIComponent(p.id), { credentials: 'same-origin' })).json(); }
      catch (e) { await new Promise(ok => setTimeout(ok, 3000)); continue; }
      if (st.state === 'ok') { if (live()) signedIn(); return; }
      if (st.state === 'expired') break;
    }
  }
}
$('lf').onsubmit = async e => {
  e.preventDefault();
  $('lbad').textContent = '';
  const r = await fetch('/web/login', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: $('pw').value }) });
  if (r.ok) { signedIn(); return; }
  $('lbad').textContent = r.status === 429 ? L.tooMany : L.wrong;
};
$('out').onclick = async () => { await fetch('/web/logout', { method: 'POST', credentials: 'same-origin' }); S.chat = null; render(); showLogin(); };

async function boot() {
  try {
    S.me = await (await api('/web/me')).json();
    $('model').textContent = S.me.model || L.noModel;
    $('hmodel').textContent = S.me.model || '';
    const takes = [S.me.vision && 'image/*', S.me.audio && 'audio/*', S.me.video && 'video/*'].filter(Boolean);
    $('pick').hidden = !takes.length;
    $('file').accept = takes.join(',');
    $('pick').title = S.me.audio || S.me.video ? L.attachAny : L.attach;
    await loadChats();
    if (S.chat && S.chat.id) await openChat(S.chat.id, true); else render();
  } catch (e) { /* the login shows */ }
}

async function loadChats() {
  S.chats = await (await api('/web/chats')).json();
  const list = $('list');
  list.textContent = '';
  const today = new Date().toDateString();
  for (const c of S.chats) {
    const d = new Date(c.updated);
    const el = document.createElement('div');
    el.className = 'item' + (S.chat && S.chat.id === c.id ? ' on' : '');
    el.innerHTML = `<span class="t"></span><span class="d"></span><button class="x" title="${esc(L.del)}">&#10005;</button>`;
    el.querySelector('.t').textContent = c.title || L.untitled;
    el.querySelector('.d').textContent = d.toDateString() === today ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      : d.toLocaleDateString([], { day: 'numeric', month: 'short' });
    el.onclick = () => { closeSide(); openChat(c.id); };
    el.querySelector('.x').onclick = async ev => {
      ev.stopPropagation();
      if (!confirm(L.delAsk)) return;
      const r = await api('/web/chats/' + c.id, { method: 'DELETE' });
      if (!r.ok) { alert(await errorOf(r)); return; }
      if (S.chat && S.chat.id === c.id) { S.chat = null; render(); }
      loadChats();
    };
    list.appendChild(el);
  }
}

async function openChat(id, quiet) {
  if (S.busy && !quiet) return;
  const r = await api('/web/chats/' + id);
  if (!r.ok) { S.chat = null; render(); return; }
  S.chat = await r.json();
  render(true);
  loadChats();
}

// ---- messages ----
function msgEl(m) {
  const el = document.createElement('div');
  if (m.user) {
    el.className = 'm user';
    if (m.images && m.images.length) {
      const im = document.createElement('div'); im.className = 'imgs';
      for (const n of m.images) { const i = document.createElement('img'); i.src = n.startsWith('data:') ? n : '/web/img/' + encodeURIComponent(n); i.alt = ''; im.appendChild(i); }
      el.appendChild(im);
    }
    if (m.videos && m.videos.length) {
      const vs = document.createElement('div'); vs.className = 'vids';
      for (const v of m.videos) {
        const w = document.createElement('div'); w.className = 'v';
        const i = document.createElement('img'); i.alt = '';
        const f = (v.frames && v.frames[0]) || '';
        i.src = f.startsWith('data:') ? f : '/web/img/' + encodeURIComponent(f);
        const b = document.createElement('span'); b.className = 'badge'; b.textContent = '\u{1F3AC} ' + clock(v.ms / 1000);
        w.appendChild(i); w.appendChild(b); vs.appendChild(w);
        if (v.audio) vs.appendChild(player(v.audio));
      }
      el.appendChild(vs);
    }
    if (m.audio && m.audio.length) {
      const cs = document.createElement('div'); cs.className = 'clips';
      for (const c of m.audio) cs.appendChild(player(c.url || c.name));
      el.appendChild(cs);
    }
    el.appendChild(document.createTextNode(m.text));
    return el;
  }
  el.className = 'm bot' + (m.summary ? ' summary' : '');
  fillBot(el, m);
  return el;
}
/** A clip's player: a saved clip by its name (the phone sends it as a WAV), or a page-made one by its blob: URL. */
function player(src) {
  const a = document.createElement('audio'); a.controls = true; a.preload = 'none';
  a.src = src.startsWith('blob:') ? src : '/web/audio/' + encodeURIComponent(src);
  return a;
}
function clock(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function fillBot(el, m) {
  el.textContent = '';
  // a summary, or an answer the agent condensed its context before (what came before it, it knows from its summary)
  if (m.summary || m.compacted) { const l = document.createElement('div'); l.className = 'lbl'; l.textContent = L.summary; el.appendChild(l); }
  // what the agent did on the way: its words between the tools, a line per tool (its main argument, how it ended)
  for (const st of m.steps || []) {
    if (st.words != null) { const w = document.createElement('div'); w.className = 'words'; w.innerHTML = md(st.words); el.appendChild(w); continue; }
    const t = document.createElement('div'); t.className = 'tool' + (st.ok === false ? ' fail' : '');
    const mark = document.createElement('span'); mark.className = 'mark'; mark.textContent = st.ok == null ? '… ' : st.ok ? '✓ ' : '✗ ';
    const n = document.createElement('span'); n.className = 'tname'; n.textContent = st.tool;
    t.appendChild(mark); t.appendChild(n);
    if (st.args) { const c = document.createElement('code'); c.textContent = st.args; t.appendChild(document.createTextNode(' ')); t.appendChild(c); }
    el.appendChild(t);
  }
  if (m.thinking) {
    const d = document.createElement('details'); d.className = 'think'; d.open = !!m.live && !m.text;
    d.innerHTML = '<summary></summary><div></div>';
    d.querySelector('summary').textContent = L.thinking;
    d.querySelector('div').textContent = m.thinking;
    el.appendChild(d);
  }
  const body = document.createElement('div'); body.className = 'body';
  body.innerHTML = md(m.text || '');
  el.appendChild(body);
  const toolRuns = (m.steps || []).some(st => st.tool && st.ok == null);
  if (m.live && m.calling) {
    // a long tool call being written (a file's whole text): nothing else shows until it ends
    const s = document.createElement('div'); s.className = 'status dots'; s.textContent = m.calling; el.appendChild(s);
  } else if (m.live && !m.text && !m.thinking && !toolRuns) {
    const s = document.createElement('div'); s.className = 'status dots'; s.textContent = m.status || L.waiting; el.appendChild(s);
  }
  if (m.error) { const e = document.createElement('div'); e.className = 'err'; e.textContent = m.error; el.appendChild(e); }
  if (m.files && m.files.length) { const f = document.createElement('div'); f.className = 'meta'; f.textContent = L.files + ': ' + m.files.join(', '); el.appendChild(f); }
  if (m.tps) { const t = document.createElement('div'); t.className = 'meta'; t.textContent = fmt(L.tps, m.tps); el.appendChild(t); }
}
function nearBottom() { const b = $('msgs'); return b.scrollHeight - b.scrollTop - b.clientHeight < 120; }
function toBottom() { const b = $('msgs'); b.scrollTop = b.scrollHeight; }
function render(scroll) {
  $('title').textContent = (S.chat && S.chat.title) || L.untitled;
  const inner = $('inner');
  inner.textContent = '';
  const msgs = (S.chat && S.chat.messages) || [];
  if (!msgs.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = S.me && !S.me.model ? L.noModel : L.empty; inner.appendChild(e); }
  for (const m of msgs) inner.appendChild(msgEl(m));
  if (scroll) toBottom();
  setBusy(S.busy);
}

// ---- sending ----
function setBusy(b) {
  S.busy = b;
  const go = $('go');
  go.innerHTML = b ? '&#9632;' : '&#10148;';
  go.setAttribute('aria-label', b ? L.stop : L.send);
  go.disabled = !b && (S.preparing > 0 || (!$('text').value.trim() && !S.images.length && !S.clips.length && !S.films.length));
}
async function send() {
  if (S.busy) { api('/web/stop', { method: 'POST' }); return; }
  const text = $('text').value.trim();
  if (S.preparing > 0 || (!text && !S.images.length && !S.clips.length && !S.films.length)) return;
  const images = S.images.map(i => i.b64);
  const shown = S.images.map(i => i.url);
  const audio = S.clips.map(c => c.wav);
  const videos = S.films.map(f => ({ frames: f.frames.map(x => ({ data: x.b64, second: x.second })), audio: f.wav, ms: f.ms }));
  const heard = S.clips.map(c => ({ url: c.url }));
  const watched = S.films.map(f => ({ frames: [f.frames[0].url], ms: f.ms, audio: f.url }));
  $('text').value = ''; grow(); S.images = []; S.clips = []; S.films = []; drawAtt();
  if (!S.chat) S.chat = { id: null, title: '', messages: [] };
  const q = { user: true, text, images: shown, audio: heard, videos: watched };
  const a = { user: false, text: '', thinking: '', live: true, steps: [] };
  S.chat.messages.push(q, a);
  render(true);
  setBusy(true);
  const botEl = $('inner').lastElementChild;
  let r;
  try {
    r = await api('/web/send', { method: 'POST', body: JSON.stringify({ chat: S.chat.id, text, images, audio, videos }) });
  } catch (e) { setBusy(false); return; }
  if (!r.ok) { a.live = false; a.error = await errorOf(r); fillBot(botEl, a); setBusy(false); return; }
  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = '';
  const on = (ev, d) => {
    const stick = nearBottom();
    if (ev === 'start') {
      S.chat.id = d.chat; S.chat.title = d.title; $('title').textContent = d.title;
      Object.assign(q, d.question, { images: shown.length ? shown : d.question.images,
        audio: heard.length ? heard : d.question.audio, videos: watched.length ? watched : d.question.videos });
      loadChats();
    } else if (ev === 'started') {
      if (d.prompt > d.cached) a.status = fmt(L.reading, d.prompt - d.cached);
    } else if (ev === 'status') {
      a.status = d.installing ? L.installing : L.waiting;
    } else if (ev === 'calling') {
      a.calling = d.text;
    } else if (ev === 'tool') {
      // the words so far stay above the tool's line, the next ones start after it
      if (a.text.trim()) a.steps.push({ words: a.text.trim() });
      a.text = ''; a.thinking = ''; a.status = ''; a.calling = '';
      a.steps.push({ id: d.id, tool: d.tool, args: d.args, ok: null });
    } else if (ev === 'tool_done') {
      const st = a.steps.slice().reverse().find(x => x.tool && x.ok == null && (!d.id || x.id === d.id));
      if (st) st.ok = d.ok;
    } else if (ev === 'reasoning') { a.thinking += d.text; a.calling = ''; }
    else if (ev === 'content') { a.text += d.text; a.calling = ''; }
    else if (ev === 'done') { Object.assign(a, d); a.live = false; a.calling = ''; }
    else if (ev === 'error') { a.error = d.message; a.live = false; a.calling = ''; }
    fillBot(botEl, a);
    if (stick) toBottom();
  };
  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let k;
      while ((k = buf.indexOf('\n\n')) >= 0) {
        const block = buf.slice(0, k); buf = buf.slice(k + 2);
        let ev = 'message', data = '';
        for (const line of block.split('\n')) {
          if (line.startsWith('event: ')) ev = line.slice(7);
          else if (line.startsWith('data: ')) data += line.slice(6);
        }
        if (data) on(ev, JSON.parse(data));
      }
    }
  } catch (e) { /* the connection broke: the phone keeps the answer */ }
  if (a.live) { a.live = false; fillBot(botEl, a); }
  setBusy(false);
  // the answer as the phone saved it (its clips from the phone now: this page's own copies let go)
  const blobs = heard.map(h => h.url).concat(watched.map(w => w.audio)).filter(Boolean);
  if (S.chat.id) Promise.resolve(openChat(S.chat.id, true)).finally(() => blobs.forEach(u => URL.revokeObjectURL(u)));
}
$('go').onclick = send;
const text = $('text');
const coarse = matchMedia('(pointer: coarse)').matches;
text.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !coarse && !e.isComposing) { e.preventDefault(); send(); } });
function grow() { text.style.height = 'auto'; text.style.height = Math.min(text.scrollHeight, innerHeight * 0.4) + 'px'; setBusy(S.busy); }
text.addEventListener('input', grow);

// ---- images (made smaller here: the phone keeps 2048 px at most) ----
$('pick').onclick = () => $('file').click();
$('file').onchange = async () => {
  for (const f of $('file').files) {
    if (f.type.startsWith('audio/') && S.me && S.me.audio) { addClip(f); continue; }
    if (f.type.startsWith('video/') && S.me && S.me.video) { addFilm(f); continue; }
    try {
      const bmp = await createImageBitmap(f);
      const k = Math.min(1, 2048 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
      const url = c.toDataURL('image/jpeg', 0.9);
      S.images.push({ url, b64: url.slice(url.indexOf(',') + 1) });
    } catch (e) { /* not an image */ }
  }
  $('file').value = '';
  drawAtt();
};
function drawAtt() {
  const box = $('att'); box.textContent = '';
  S.images.forEach((im, i) => {
    const s = document.createElement('span');
    s.innerHTML = '<img alt=""><button aria-label="×">&#10005;</button>';
    s.querySelector('img').src = im.url;
    s.querySelector('button').onclick = () => { S.images.splice(i, 1); drawAtt(); };
    box.appendChild(s);
  });
  S.films.forEach((fm, i) => {
    const s = document.createElement('span'); s.className = 'vid';
    s.innerHTML = '<img alt=""><span class="badge"></span><button aria-label="×">&#10005;</button>';
    s.querySelector('img').src = fm.frames[0].url;
    s.querySelector('.badge').textContent = '\u{1F3AC} ' + clock(fm.ms / 1000);
    s.querySelector('button').onclick = () => { if (fm.url) URL.revokeObjectURL(fm.url); S.films.splice(i, 1); drawAtt(); };
    box.appendChild(s);
  });
  S.clips.forEach((c, i) => {
    const s = document.createElement('span');
    s.innerHTML = '<span class="chip"></span><button aria-label="×">&#10005;</button>';
    s.querySelector('.chip').textContent = '\u{1F3B5} ' + clock(c.seconds);
    s.querySelector('button').onclick = () => { URL.revokeObjectURL(c.url); S.clips.splice(i, 1); drawAtt(); };
    box.appendChild(s);
  });
  if (S.preparing > 0) {
    const s = document.createElement('span'); s.innerHTML = '<span class="chip dots"></span>';
    s.querySelector('.chip').textContent = L.preparing; box.appendChild(s);
  }
  setBusy(S.busy);
}

// ---- sound and video, made here into what the phone takes (AudioDecoder / VideoDecoder's shapes): a clip is 16 kHz
// mono, its first 30 s, as a WAV; a video is its frames (one a second, at most 32 spread over a longer one, 768 px)
// with the seconds they are at, and its sound - the file itself is never sent ----
const RATE = 16000, MAX_CLIP_S = 30, MAX_FRAMES = 32, FRAME_SIDE = 768;
// a long file's sound decoded from its first HEAD bytes (30 s of almost any format: MP3, AAC, Ogg, FLAC, a WAV up to
// 48 kHz stereo 16-bit) - the decoder holds the whole track in memory, two hours of it would be gigabytes; whole when
// those bytes alone do not decode (an MP4 with its index at the end), up to WHOLE bytes
const HEAD = 8 << 20, WHOLE = 96 << 20;
/** The first 30 s of a file's sound, 16 kHz mono (the browser's decoder; null: none it can read, or no decoder). */
async function pcm16k(file) {
  const AC = window.AudioContext || window.webkitAudioContext, OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if (!AC || !OAC) return null;
  const decode = async blob => {
    const ctx = new AC();
    try { return await ctx.decodeAudioData(await blob.arrayBuffer()); } catch (e) { return null; } finally { ctx.close(); }
  };
  try {
    let buf = file.size > HEAD ? await decode(file.slice(0, HEAD)) : null;
    if (!buf && file.size <= WHOLE) buf = await decode(file);
    if (!buf) return null;
    const n = Math.ceil(Math.min(buf.duration, MAX_CLIP_S) * RATE);
    if (n <= 0) return null;
    // one output channel: the browser mixes the channels down (stereo: their average)
    const off = new OAC(1, n, RATE);
    const src = off.createBufferSource(); src.buffer = buf; src.connect(off.destination); src.start(0);
    return (await off.startRendering()).getChannelData(0);
  } catch (e) { return null; }
}
/** Samples as a PCM16 WAV: its bytes. */
function wavOf(pcm) {
  const b = new DataView(new ArrayBuffer(44 + pcm.length * 2));
  const tag = (o, t) => { for (let i = 0; i < 4; i++) b.setUint8(o + i, t.charCodeAt(i)); };
  tag(0, 'RIFF'); b.setUint32(4, 36 + pcm.length * 2, true); tag(8, 'WAVE'); tag(12, 'fmt ');
  b.setUint32(16, 16, true); b.setUint16(20, 1, true); b.setUint16(22, 1, true); b.setUint32(24, RATE, true);
  b.setUint32(28, RATE * 2, true); b.setUint16(32, 2, true); b.setUint16(34, 16, true); tag(36, 'data');
  b.setUint32(40, pcm.length * 2, true);
  for (let i = 0; i < pcm.length; i++) b.setInt16(44 + i * 2, Math.round(Math.max(-1, Math.min(1, pcm[i])) * 32767), true);
  return new Uint8Array(b.buffer);
}
function b64Of(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
/** A clip from samples: its WAV (base64), a blob: URL to play it, its length. */
function clipOf(pcm) {
  const wav = wavOf(pcm);
  return { wav: b64Of(wav), url: URL.createObjectURL(new Blob([wav], { type: 'audio/wav' })), seconds: pcm.length / RATE };
}
async function addClip(f) {
  S.preparing++; drawAtt();
  try {
    const pcm = await pcm16k(f);
    if (!pcm || pcm.length < RATE / 4) alert(L.audioBad); else S.clips.push(clipOf(pcm));
  } catch (e) { alert(L.audioBad); }
  finally { S.preparing--; drawAtt(); }
}
/** The ms the frames of a video [ms] long are taken at (VideoDecoder.frameTimes). */
function frameTimes(ms) {
  const n = Math.max(1, Math.min(MAX_FRAMES, Math.ceil(Math.max(ms, 1) / 1000)));
  return Array.from({ length: n }, (_, i) => ms <= MAX_FRAMES * 1000 ? i * 1000 : Math.floor(i * ms / n));
}
async function addFilm(f) {
  S.preparing++; drawAtt();
  const url = URL.createObjectURL(f);
  try {
    const v = document.createElement('video'); v.muted = true; v.preload = 'auto'; v.playsInline = true; v.src = url;
    await new Promise((ok, bad) => { v.onloadeddata = ok; v.onerror = bad; });
    const ms = Math.round(v.duration * 1000);
    if (!(ms > 0) || !v.videoWidth) throw new Error('no picture');
    const k = Math.min(1, FRAME_SIDE / Math.max(v.videoWidth, v.videoHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
    const g = c.getContext('2d');
    const frames = [];
    for (const t of frameTimes(ms)) {
      // the frame at that time (a seek there; the first is already shown)
      const at = Math.min(t / 1000, Math.max(0, v.duration - 0.05));
      if (Math.abs(v.currentTime - at) > 0.001) await new Promise((ok, bad) => { v.onseeked = ok; v.onerror = bad; v.currentTime = at; });
      g.drawImage(v, 0, 0, c.width, c.height);
      const du = c.toDataURL('image/jpeg', 0.9);
      frames.push({ url: du, b64: du.slice(du.indexOf(',') + 1), second: Math.floor(t / 1000) });
    }
    // its sound, when the model hears (the pack's audio encoder) and the browser reads it (the whole track decoded:
    // only for a video up to 3 minutes long); without it the frames alone
    const pcm = S.me && S.me.videoSound && ms <= 180000 ? await pcm16k(f) : null;
    const sound = pcm && pcm.length >= RATE / 4 ? clipOf(pcm) : null;
    S.films.push({ frames, ms, wav: sound ? sound.wav : null, url: sound ? sound.url : null });
  } catch (e) { alert(L.videoBad); }
  finally { URL.revokeObjectURL(url); S.preparing--; drawAtt(); }
}

// ---- the rest ----
$('new').textContent = '+ ' + L.newChat;
$('new').onclick = () => { if (S.busy) return; S.chat = null; closeSide(); render(); loadChats(); text.focus(); };
$('out').textContent = L.signOut;
$('pick').title = L.attach;
text.placeholder = L.message;
$('pw').placeholder = L.password;
$('lhint').textContent = L.hint;
$('qrhint').textContent = L.qr;
$('or').textContent = L.or;
$('lgo').textContent = L.signIn;
const closeSide = () => { $('side').classList.remove('open'); $('shade').classList.remove('open'); };
$('menu').onclick = () => { $('side').classList.add('open'); $('shade').classList.add('open'); };
$('shade').onclick = closeSide;
// back to the tab: what the app changed meanwhile
document.addEventListener('visibilitychange', () => { if (!document.hidden && !S.busy && !$('login').classList.contains('on')) boot(); });
boot();
</script>
